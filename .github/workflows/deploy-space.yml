# Deploy to a Hugging Face Docker Space on every push to main.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   secrets   HF_TOKEN        Hugging Face access token with write permission (required)
#             GROQ_API_KEY    copied into the Space's secrets (optional; or set it on the Space)
#             GEMINI_API_KEY  same
#   variable  SPACE_NAME      Space name, default "msme-scheme-assistant"
# The Space is created on the first run under the token owner's account. Hugging Face builds the
# Dockerfile itself; this job only uploads the files.
name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install --no-deps -e .
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SPACE_NAME: ${{ vars.SPACE_NAME || 'msme-scheme-assistant' }}
    steps:
      - name: Skip until HF_TOKEN is configured
        if: env.HF_TOKEN == ''
        run: echo "::notice::Add the HF_TOKEN repository secret to enable deployment."
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Upload to the Space
        if: env.HF_TOKEN != ''
        run: |
          pip install -q "huggingface_hub>=0.25"
          python scripts/deploy_space.py
