[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nabard-qa"
version = "0.1.0"
description = "RAG-based GenAI QnA assistant over NABARD annual reports and rural / MSME scheme documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pdfminer.six>=20240706",
    "fastembed>=0.5",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# GPU box only: LoRA fine-tuning of an open-weights model on the generated SFT set
finetune = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "trl>=0.10", "datasets>=2.20", "bitsandbytes>=0.43", "accelerate>=0.33"]

[project.scripts]
nabard-qa = "nabard_qa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nabard_qa = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
